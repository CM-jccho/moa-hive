# ─────────────────────────────────────────────────────────────
# 이 파일은 .github/workflows/release-and-pages.yml 의 사본입니다.
# GitHub 웹에서 새 파일로 붙여넣어 워크플로를 만들 때 사용하세요.
#   경로: .github/workflows/release-and-pages.yml
# ─────────────────────────────────────────────────────────────
name: Release & Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 태그 (예: v0.3.0)'
        required: false
        default: 'v0.3.0'
      skip_build:
        description: 'Pages만 배포하고 앱 빌드는 건너뜁니다'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── 1. GitHub Pages: docs/ 정적 사이트 ──
  pages:
    name: Deploy Pages (docs)
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check existing Pages build type
        id: pages_type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo "none")
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "Pages build type: ${TYPE}"
      - name: Setup Pages
        if: steps.pages_type.outputs.type != 'legacy'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs
        if: steps.pages_type.outputs.type != 'legacy'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        if: steps.pages_type.outputs.type != 'legacy'
        uses: actions/deploy-pages@v4

  # ── 2. macOS .dmg · Windows .exe 빌드 ──
  build:
    name: Build ${{ matrix.target }} (${{ matrix.arch }})
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag')
      || (github.event_name == 'workflow_dispatch' && inputs.skip_build != true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: universal
          - os: macos-latest
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Show artifacts
        shell: bash
        run: ls -R dist || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moa-hive-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  # ── 3. GitHub Release에 산출물 업로드 ──
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release files
        run: ls -la artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: MOA Hive ${{ steps.tag.outputs.name }}
          body: |
            ## MOA Hive ${{ steps.tag.outputs.name }}

            🔒 **100% 로컬 실행** — 대화·문서·API 키가 외부 서버로 나가지 않습니다.

            | OS | 파일 | 실행 |
            |---|---|---|
            | macOS (Apple Silicon · Intel 공용) | `MOA-Hive-${{ steps.tag.outputs.ver }}-universal.dmg` | 열고 Applications로 이동 → 우클릭 → 열기 |
            | macOS (Apple Silicon) | `MOA-Hive-${{ steps.tag.outputs.ver }}-arm64.dmg` | 위와 동일 |
            | Windows 10/11 x64 | `MOA-Hive-Setup-${{ steps.tag.outputs.ver }}.exe` | 설치 → SmartScreen은 “추가 정보 → 실행” |

            Node.js v18+가 있으면 설치 없이 `start.command` / `start.bat`로도 실행할 수 있습니다.

            웹 데모 · 설치 안내: https://cm-jccho.github.io/moa-hive/
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
